<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MUV 变量表格编辑器</title>
<style>
:root { --bg: #1a1c24; --bg2: #22242e; --bg3: #2a2d38; --border: #3a3d48; --text: #e0e0e0; --sub: #8a8a8a; --accent: #4abfab; --gold: #c5a065; --radius: 6px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', 'Noto Sans SC', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; height: 100vh; display: flex; flex-direction: column; }
.header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg2); }
.header .title { font-weight: 700; font-size: 15px; flex: 1; }
.btn { padding: 6px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg3); color: var(--text); cursor: pointer; font-size: 12px; font-family: inherit; }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
.main { flex: 1; overflow: auto; display: flex; flex-direction: column; }
.drop-zone { margin: 24px auto; padding: 48px 32px; border: 2px dashed var(--border); border-radius: 12px; text-align: center; cursor: pointer; color: var(--sub); max-width: 480px; width: 90%; }
.drop-zone:hover { border-color: var(--gold); color: var(--gold); }
.drop-zone .icon { font-size: 36px; margin-bottom: 10px; }
.output-section { flex-shrink: 0; border-top: 2px solid var(--gold); }
.output-header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg2); }
.output-content { max-height: 260px; overflow: auto; padding: 12px 16px; background: #0d0e12; font-family: 'Consolas', monospace; font-size: 11px; white-space: pre-wrap; color: #c0c0c0; }
</style>
</head>
<body>
<div class="header">
  <span class="title">📊 MUV 变量表格编辑器</span>
  <span id="badge" style="display:none;font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(197,160,101,0.15);color:var(--gold)"></span>
  <button class="btn" onclick="document.getElementById('fileInput').click()">📂 加载卡片</button>
  <button id="btnGenerate" class="btn btn-accent" style="display:none" onclick="generateBlock()">⚡ 生成 MUV 块</button>
</div>
<div class="main" id="main">
  <div class="drop-zone" onclick="document.getElementById('fileInput').click()" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
    <div class="icon">📁</div>
    <div>拖放 MUV 角色卡 JSON 文件到此处</div>
    <div style="font-size:11px;margin-top:6px;opacity:0.7">或点击选择文件 · 支持 .json · 最大 5MB</div>
  </div>
  <input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleFile(event)">
</div>
<div class="output-section" id="outputSection" style="display:none">
  <div class="output-header">
    <span style="font-weight:600;color:var(--gold);flex:1">✅ 生成的 MUV 块</span>
    <button class="btn" onclick="copyBlock()">📋 复制</button>
    <button class="btn" onclick="closeOutput()">✕</button>
  </div>
  <div class="output-content" id="outputContent"></div>
</div>
<script>
let state = { cardName: '', schemas: [], initvarData: {}, edits: {}, generatedBlock: '' }
// Where the variable tree was read from, shown next to the card name. `worldbook-initvar`
// is the only *heuristic* source (a world-book entry marked `[initvar]` with bare YAML
// and no tag), so it has to be visible — otherwise a wrong guess looks exactly like a
// card that genuinely declares its variables.
const SOURCE_LABEL = { 'initvar': '<initvar> 块', 'variable-insert': '<VariableInsert>', 'worldbook-initvar': '世界书 [initvar] 条目', 'none': '' }
function badgeText(d) {
  const label = SOURCE_LABEL[d.schemaSource]
  return d.name + (label ? ' · ' + label : '')
}
function handleDrop(e) { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadFile(f) }
function handleFile(e) { const f = e.target.files[0]; if (f) loadFile(f) }
function loadFile(f) { const r = new FileReader(); r.onload = () => { try { parseCard(JSON.parse(r.result)) } catch(err) { alert('JSON error: '+err.message) } }; r.readAsText(f) }
async function parseCard(json) {
  document.getElementById('main').innerHTML = '<div style="padding:16px;color:var(--sub)">解析中...</div>'
  try {
    const r = await fetch('/api/muv-table/parse-card', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(json) })
    const d = await r.json(); if (!d.ok) throw new Error(d.error)
    state = { cardName: d.name, schemas: d.schemas, initvarData: d.initvarData, edits: {}, generatedBlock: '' }
    document.getElementById('badge').style.display = 'inline'; document.getElementById('badge').textContent = badgeText(d)
    document.getElementById('btnGenerate').style.display = 'inline-block'
    renderTable()
  } catch(e) { document.getElementById('main').innerHTML = '<div style="padding:12px;color:var(--danger)">⚠ '+e.message+'</div>' }
}
function renderTable() {
  let html = '<table style="width:100%;border-collapse:collapse"><thead><tr><th style="width:40%;text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);font-size:11px;color:var(--sub)">变量</th><th style="width:60px;text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);font-size:11px;color:var(--sub)">类型</th><th style="text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);font-size:11px;color:var(--sub)">值</th></tr></thead><tbody>'
  function flatten(schemas, data, prefix, depth) {
    let rows = ''; prefix = prefix || ''; depth = depth || 0
    for (const f of schemas) {
      const p = prefix ? prefix+'.'+f.name : f.name; const v = data?.[f.name]
      if (f.type==='object' && f.children && f.children.length>0) {
        rows += '<tr><td style="padding:4px 10px;padding-left:'+(10+depth*18)+'px;font-weight:600">📂 '+esc(f.name)+'</td><td style="padding:4px 10px"><span style="font-size:10px;padding:1px 6px;border-radius:3px;background:rgba(138,138,138,0.12);color:var(--sub)">'+f.type+'</span></td><td style="padding:4px 10px;color:var(--sub);font-size:11px">▸ 展开</td></tr>'
        rows += flatten(f.children, v||{}, p, depth+1)
      } else {
        const ev = state.edits[p]!==undefined ? state.edits[p] : (v??'')
        rows += '<tr><td style="padding:4px 10px;padding-left:'+(10+depth*18)+'px;color:var(--sub)">  '+esc(f.name)+'</td><td style="padding:4px 10px"><span style="font-size:10px;padding:1px 6px;border-radius:3px;background:'+(f.type==='number'?'rgba(74,191,171,0.15)':'rgba(197,160,101,0.15)')+';color:'+(f.type==='number'?'var(--accent)':'var(--sub)')+'">'+f.type+'</span></td><td style="padding:4px 10px"><input type="'+(f.type==='number'?'number':'text')+'" value="'+escAttr(ev)+'" onchange="handleEdit(\''+escAttr(p)+'\',this.value)" style="background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:3px 8px;color:var(--text);font-size:12px;width:'+(f.type==='number'?'100px':'100%')+';max-width:260px"></td></tr>'
      }
    }
    return rows
  }
  html += flatten(state.schemas, state.initvarData); html += '</tbody></table>'
  document.getElementById('main').innerHTML = '<div style="flex:1;overflow:auto;padding:8px 12px">'+html+'</div>'
}
function handleEdit(path, val) { state.edits[path] = val }
async function generateBlock() {
  const edits = Object.entries(state.edits).map(([p,v]) => ({path:p, value:v}))
  try {
    const r = await fetch('/api/muv-table/generate', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({originalData:state.initvarData, edits}) })
    const d = await r.json(); if (!d.ok) throw new Error(d.error)
    state.generatedBlock = d.block
    document.getElementById('outputSection').style.display = 'block'
    document.getElementById('outputContent').textContent = d.block
  } catch(e) { alert(e.message) }
}
async function copyBlock() { await navigator.clipboard.writeText(state.generatedBlock) }
function closeOutput() { document.getElementById('outputSection').style.display = 'none' }
function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function escAttr(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;') }
</script>
</body>
</html>
